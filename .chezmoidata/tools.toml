mise = "0.26.1"
groups = ["dev"]

[tools.bitwarden-cli]
mise_id = "npm:@bitwarden/cli"
mise = "2026.11.0"
groups = ["dev"]

[tools.bun]
mise = "1.4.5"
groups = ["dev"]

[tools.deno]
mise = "2.9.8"
groups = ["dev"]

[tools.direnv]
mise = "2.38.2"
groups = ["dev"]

[tools.eza]
mise = "0.23.5"
groups = ["dev"]

[tools.fd]
mise = "10.5.2"
groups = ["dev"]

[tools.fzf]
mise = "0.75.0"
groups = ["dev"]

[tools.gh]
mise = "2.105.0"
groups = ["dev"]

[tools.ghq]
mise = "1.12.0"
