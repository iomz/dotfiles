# Per-host tool inventory.
#
# One entry per tool; the table key is the tool's identity.
# An entry declares either `mise` (cross-platform) or OS tables such as
# `darwin.brew`, never both. `mise_id` overrides the mise tool name, e.g.
# for backend-prefixed ids such as "pipx:ansible".
# `hosts` or `groups` restrict an entry; without either it applies everywhere.
# Hosts and groups are declared under [hosts].
# `arch` (list of chezmoi arch values) further limits an entry.
# `arch` inside an OS table (e.g. `linux.arch`) limits only that OS.
#
# Rendered into ~/.config/mise/config.toml and the package install script.
# Edit this file, not the rendered output.

[hosts.helianthus]
groups = ["dev"]

[hosts.oxalis]
groups = ["dev"]

[hosts.sazanka]
groups = ["dev"]

[hosts.nasatya]
groups = ["dev"]

# --- mise ---------------------------------------------------------------

[tools.ansible]
mise_id = "pipx:ansible"
mise = { version = "15.0.0", uvx = false, pipx_args = "--include-deps" }

[tools.apm-cli]
mise_id = "pipx:apm-cli"
mise = "0.36.1"

[tools.bat]
mise = "0.26.1"

[tools.bitwarden-cli]
mise_id = "npm:@bitwarden/cli"
mise = "2026.11.0"

[tools.bun]
mise = "1.4.5"

[tools.deno]
mise = "2.9.8"

[tools.direnv]
mise = "2.38.2"

[tools.eza]
mise = "0.23.5"

[tools.fd]
mise = "10.5.2"

[tools.fzf]
mise = "0.75.0"

[tools.gh]
mise = "2.105.0"

[tools.ghq]
mise = "1.12.0"

[tools.glab]
mise = "1.131.0"

[tools.go]
mise = "1.27.4"

[tools.golangci-lint]
mise = "2.15.0"

[tools.just]
mise = "1.59.0"

[tools.lua]
mise = "5.5.1"
# Homebrew nmap depends on Homebrew lua; guarding it blocks nmap upgrades.
homebrew_guard = false

[tools.neovim]
mise = "0.12.6"

[tools.node]
mise = "26.13.1"

[tools.pipx]
mise = "1.18.19"

[tools.pnpm]
mise = "12.21.0"

[tools.python]
mise = "3.15.2"

[tools.rclone]
mise = "1.76.0"

[tools.restic]
mise = "0.20.0"

[tools.ripgrep]
mise = "15.2.0"

[tools.starship]
mise = "1.27.0"

[tools.tree-sitter]
mise = "0.27.2"

[tools.uv]
mise = "0.13.9"

[tools.zellij]
mise = "0.46.0"

