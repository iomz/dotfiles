# --- Linux packages -----------------------------------------------------

[tools.build-essential]
# C toolchain: nvim-treesitter compiles parsers and mise builds lua from source.
linux.apt = "build-essential"
groups = ["stem"]

[tools.curl]
linux.apt = "curl"

[tools.dig]
# Linux only, like lsof and tcpdump: macOS ships them.
linux.apt = "bind9-dnsutils"

[tools.dirmngr]
# Key retrieval for the mise apt source.
linux.apt = "dirmngr"
groups = ["stem"]

[tools.extrepo]
# Enables the mise apt source.
linux.apt = "extrepo"
groups = ["stem"]

[tools.locales]
# Generates en_US.UTF-8, which the package script makes the system locale.
linux.apt = "locales"

[tools.lsof]
linux.apt = "lsof"

[tools.tcpdump]
linux.apt = "tcpdump"

[tools.unzip]
linux.apt = "unzip"

[tools.vim]
linux.apt = "vim"

[tools.zsh]
linux.apt = "zsh"

# --- Homebrew guard -----------------------------------------------------
# Interactive zsh forbids Homebrew formulae named like mise-owned tools.
# Entries with `homebrew_guard = false` are left out.
# These extra names have no mise entry of their own: python3 and ruby are carried
# over from the previous hand-written list, zsh must stay the system one,
# which is the login shell, and chezmoi lives in ~/bin on every host.

[homebrew_guard]
extra = ["chezmoi", "python3", "ruby", "zsh"]
