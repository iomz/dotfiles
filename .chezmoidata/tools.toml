# --- apt: Linux only -----------------------------------------------------

[tools.build-essential]
linux.apt = "build-essential"

[tools.curl]
linux.apt = "curl"

[tools.dirmngr]
linux.apt = "dirmngr"

[tools.extrepo]
linux.apt = "extrepo"

[tools.libbz2-dev]
linux.apt = "libbz2-dev"

[tools.libffi-dev]
linux.apt = "libffi-dev"

[tools.liblzma-dev]
linux.apt = "liblzma-dev"

[tools.libncursesw5-dev]
linux.apt = "libncursesw5-dev"

[tools.libxml2-dev]
linux.apt = "libxml2-dev"

[tools.libxmlsec1-dev]
