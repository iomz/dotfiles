# --- Linux packages -----------------------------------------------------

[tools.build-essential]
# C toolchain: nvim-treesitter compiles parsers and mise builds lua from source.
linux.apt = "build-essential"
groups = ["dev"]

[tools.curl]
linux.apt = "curl"

[tools.dirmngr]
linux.apt = "dirmngr"

[tools.extrepo]
linux.apt = "extrepo"

[tools.unzip]
linux.apt = "unzip"

[tools.vim]
linux.apt = "vim"

[tools.zsh]
linux.apt = "zsh"

# --- Homebrew guard -----------------------------------------------------
# Interactive zsh forbids Homebrew formulae named like mise-owned tools.
# Entries with `homebrew_guard = false` are left out.
# These extra names have no mise entry of their own; they are carried over
# from the previous hand-written list.

[homebrew_guard]
extra = ["python3", "ruby"]
