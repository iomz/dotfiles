# Per-host tool inventory.
#
# One entry per tool; the table key is the tool's identity.
# An entry declares either `mise` (cross-platform) or OS tables such as
# `darwin.brew`, never both. `mise_id` overrides the mise tool name, e.g.
# for backend-prefixed ids such as "pipx:ansible".
# `hosts` or `groups` restrict an entry; without either it applies everywhere.
# mise entries must declare one of them, so unknown hosts stay free of mise.
# Hosts and groups are declared under [hosts].
# `arch` (list of chezmoi arch values) further limits an entry.
# `arch` inside an OS table (e.g. `linux.arch`) limits only that OS.
#
# Sections (mise, macOS and Linux, macOS, Linux packages), name order and
# key order are derived; just tool-* recipes and just tool-fmt maintain them.
#
# Rendered into ~/.config/mise/config.toml and the package install script.
# Edit this file, not the rendered output.

[hosts.helianthus]
groups = ["stem"]

[hosts.oxalis]
groups = ["stem"]

[hosts.sazanka]
groups = ["stem"]

[hosts.nasatya]
groups = ["stem"]

