{{- /* Rendered from .chezmoidata/tools.toml; edit the inventory, not this output. */ -}}
{{- $tools := dict }}
{{- range $name, $tool := .tools }}
{{-   if and (hasKey $tool "mise") (eq (includeTemplate "tool-selected" (dict "tool" $tool "data" $)) "true") }}
{{-     $_ := set $tools (get $tool "mise_id" | default $name) $tool.mise }}
{{-   end }}
{{- end }}
{{- /* toToml keeps nested options (e.g. install_env) valid TOML. */ -}}
{{ toToml (dict "tools" $tools) }}
